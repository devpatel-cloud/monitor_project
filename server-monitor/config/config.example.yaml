# Linux Server Monitor Platform Configuration
server:
  host: "0.0.0.0"
  port: 8000
  api_prefix: "/api/v1"

database:
  path: "/var/lib/server-monitor/monitor.db"

duckdns:
  domain: "sanjaya-server.duckdns.org"
  token: "YOUR_DUCKDNS_TOKEN_HERE" # Kept secret, never exposed in API

agent:
  interval_seconds: 10
  sudo_enabled: true
