server {
    listen 80;
    listen [::]:80;
    server_name sanjaya-server.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanjaya-server.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/sanjaya-server.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanjaya-server.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Serve React Frontend Build
    location / {
        root /opt/server-monitor/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy FastAPI Backend API
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
