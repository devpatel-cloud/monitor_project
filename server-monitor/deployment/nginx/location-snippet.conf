# Server Monitor Location Snippet
# Safe include file for existing Sanjaya Nginx HTTPS server block
# Insert into existing /etc/nginx/conf.d/sanjaya.conf or default HTTPS server block:
# include /etc/nginx/snippets/server-monitor-location.conf;

# 1. Backend REST API Route
location /monitor/api/v1/ {
    proxy_pass http://127.0.0.1:8000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2. Frontend React Web Application Route
location /monitor/ {
    proxy_pass http://127.0.0.1:3000/monitor/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
